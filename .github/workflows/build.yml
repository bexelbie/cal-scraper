# ABOUTME: Builds and pushes the container image to ghcr.io on pushes to main and version tags.
# ABOUTME: Tags images as :latest on main, :vX.Y.Z on release tags.

name: Build container

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cal_scraper/**"
      - "pyproject.toml"
      - "Containerfile"
      - "entrypoint.sh"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: container-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve base image digest
        id: base
        env:
          BASE_IMAGE_NAME: python:3.13-slim
        run: |
          set -euo pipefail
          digest="$(crane digest "${BASE_IMAGE_NAME}")"
          {
            echo "name=${BASE_IMAGE_NAME}"
            echo "digest=${digest}"
            echo "ref=${BASE_IMAGE_NAME}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Determine image tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set build metadata
        id: build_meta
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          test -n "$version"
          {
            echo "version=${version}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies and run tests
        run: |
          set -euo pipefail
          python -m pip install --quiet -e '.[dev]'
          python -m pytest

      - name: Build image
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.tag.outputs.tag }}"
          podman build \
            --build-arg "VERSION=${{ steps.build_meta.outputs.version }}" \
            --build-arg "BUILD_DATE=${{ steps.build_meta.outputs.build_date }}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --build-arg "BASE_IMAGE_REF=${{ steps.base.outputs.ref }}" \
            --build-arg "BASE_IMAGE_NAME=${{ steps.base.outputs.name }}" \
            --build-arg "BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}" \
            -t "$image" .

      - name: Push image
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          podman push "ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.tag.outputs.tag }}"

      - name: Push latest for tags too
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          podman tag "${image}:${{ steps.tag.outputs.tag }}" "${image}:latest"
          podman push "${image}:latest"
